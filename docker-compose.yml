version: "3.9"

services:
  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # MariaDB
  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecomplaint
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mariadb
    networks:
      - app-network
    restart: unless-stopped

  # Gateway
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./apps/gateway/.env
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - mariadb
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./apps/auth-service/.env
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - mariadb
    restart: unless-stopped

  # Complaint Service
  complaint-service:
    build:
      context: ./apps/complaint-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./apps/complaint-service/.env
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - mariadb
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - ./apps/user-service/.env
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - mariadb
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local
  mariadb_data:
    driver: local

networks:
  app-network:
    driver: bridge
